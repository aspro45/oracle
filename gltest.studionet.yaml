# Studionet deployment configuration.
# Set DEV_PRIVATE_KEY only in your local shell or private CI environment.
networks:
  default: studionet
  studionet:
    url: https://studio.genlayer.com/api
    accounts:
      - ${DEV_PRIVATE_KEY}
    from: ${DEV_PRIVATE_KEY}

paths:
  contracts: contracts
  artifacts: artifacts

environment: .env
